<!doctype html>
<html lang="pt" data-depth="1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contacto · Paulo Rebelo Treino Canino</title>
  <meta name="description" content="Contacte Paulo Rebelo para avaliação comportamental e treino canino nos Açores.">
  <link rel="stylesheet" href="../assets/styles.css">
  <script defer src="../assets/content.js"></script>
  <script defer src="../assets/site.js"></script>
</head>
<body data-page="contact">
  <header class="site-header" data-header></header>
  <main>
    <section class="page-hero"><p class="eyebrow">Contacto</p><h1>Marcar avaliação ou inscrição em evento.</h1><p>Explique a situação com o seu cão ou escolha um evento futuro para inscrição. Paulo responde por telefone, WhatsApp ou email.</p></section>
    <section class="section contact-grid">
      <aside class="contact-panel"><h2>Paulo Rebelo</h2><p>Treino Canino · Açores, Portugal</p><div data-contact-info></div></aside>
      <form class="form" action="mailto:paulorebelotreinocanino@gmail.com" method="post" enctype="text/plain">
        <div class="field-grid"><label>Nome<input name="Nome" required></label><label>Email<input type="email" name="Email" required></label></div>
        <div class="field-grid"><label>Telefone<input name="Telefone"></label><label>Nome do cão<input name="Nome do cão"></label></div>
        <div class="field-grid"><label>Idade do cão<input name="Idade do cão"></label><label>Preferência de contacto<select name="Preferência de contacto"><option>Telefone</option><option>WhatsApp</option><option>Email</option></select></label></div>
        <label>Motivo do contacto<select name="Motivo do contacto" data-contact-reason></select></label>
        <label>Mensagem<textarea name="Mensagem" required></textarea></label>
        <button class="button" type="submit">Enviar pedido</button>
      </form>
    </section>
  </main>
  <footer class="site-footer" data-footer></footer>
</body>
</html>
